<g clip-path="url(#screen)">
<g class="cmd"><text x="16" y="66" fill="#0969da">$</text><text x="31.66" y="66" fill="#1f2328">claude "Which endpoints of orders and payments are broken, and which does nobody call?"</text>
<g class="cover"><rect x="31.66" y="53" width="760" height="19" fill="#ffffff"/>
<rect class="cur" x="31.66" y="55" width="7.83" height="15" fill="#6e7781"/></g></g>
<text class="l0" x="16" y="85" fill="#8250df">  ⏺ Skill api-dead-ends:api-health</text><text class="l1" x="16" y="104" fill="#8250df">  ⏺ ade · detect_project</text><text class="l2" x="16" y="123" fill="#8250df">  ⏺ ade · analyze_usage  orders  (Datadog APM, 90 days)</text><text class="l3" x="16" y="142" fill="#8250df">  ⏺ ade · analyze_usage  payments  (Prometheus, 30 days)</text><text class="l4" x="16" y="161" fill="#1f2328"></text><text class="l5" x="16" y="180" fill="#1f2328">I analysed only the exported files in observability/. Nothing was sent to production.</text><text class="l6" x="16" y="199" fill="#1f2328" font-weight="700">Broken: orders DELETE /orders/{id} — 1,080 / 14,580 5xx (7.4%), about 12 a day for 90 days.</text><text class="l7" x="16" y="218" fill="#1f2328" font-weight="700">Broken: payments POST /payments — no 502s until 2026-11-22, since then 60 a day (about 2.3%</text><text class="l8" x="16" y="237" fill="#1f2328">of payment creations). Check what changed around 2026-11-22.</text><text class="l9" x="16" y="256" fill="#1f2328" font-weight="700">Not called in the window: orders POST /orders/{id}/repeat — zero calls in 90 days</text><text class="l10" x="16" y="275" fill="#1f2328">(confidence high). payments GET /payments/export — may be periodic; 30 days could miss it.</text><text class="l11" x="16" y="294" fill="#1f2328" font-weight="700">Undocumented: orders GET /orders/export — 1,800 calls, Datadog records it as its own route,</text><text class="l12" x="16" y="313" fill="#1f2328">missing from routes.txt.</text><text class="l13" x="16" y="332" fill="#1f2328">"Not seen" doesn't prove an endpoint is dead. I haven't changed or deprecated anything.</text>
</g>
</svg>
