<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>API report</title>
<style>:root{--bg:#f6f7f9;--panel:#fff;--ink:#151b23;--muted:#5d6876;--faint:#66707c;--line:#e3e7ec;--hover:#f0f3f6;--acc:#2563eb;--acc-s:#e6eeff;--bad:#c0281f;--bad-s:#fde8e6;--warn:#965a00;--warn-s:#fff1d6;--good:#178a4c;--good-s:#e1f5e9;--gray-s:#eef0f3}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#151b23;--ink:#e6edf3;--muted:#9aa6b2;--faint:#8794a1;--line:#262f3a;--hover:#1b2330;--acc:#6ea0ff;--acc-s:#16264a;--bad:#ff7b72;--bad-s:#3b1716;--warn:#f0b44c;--warn-s:#3a2a0c;--good:#4fd08a;--good-s:#0f3221;--gray-s:#1e2631}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:0.875rem/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:18px 16px 40px}header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:1.1875rem;margin:0}.sub{color:var(--muted);font-size:0.78125rem}.seg{display:flex;background:var(--gray-s);border-radius:9px;padding:3px}
.seg button{border:0;background:none;color:var(--muted);padding:6px 11px;border-radius:7px;font:inherit;font-size:0.8125rem;cursor:pointer}.seg button.on{background:var(--panel);color:var(--ink);font-weight:600}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}.tabs button{border:0;background:none;font:inherit;color:var(--muted);padding:9px 11px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--ink);font-weight:600}.cnt{font-size:0.6875rem;padding:1px 6px;border-radius:999px;background:var(--gray-s);margin-left:5px}.cnt.bad{background:var(--bad-s);color:var(--bad)}.cnt.warn{background:var(--warn-s);color:var(--warn)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer;font:inherit;color:inherit;text-align:left;width:100%}
.tile .k{font-size:0.75rem;color:var(--muted)}.tile .v{font-size:1.4375rem;font-weight:650}.tile.bad .v{color:var(--bad)}.tile.warn .v{color:var(--warn)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:auto}.card h2{font-size:0.875rem;margin:0;padding:11px 13px;border-bottom:1px solid var(--line)}
.desc{padding:9px 13px;color:var(--muted);font-size:0.8125rem;border-bottom:1px solid var(--line)}table{width:100%;border-collapse:collapse}
th{font-size:0.71875rem;text-transform:uppercase;letter-spacing:.03em;color:var(--faint);text-align:left;font-weight:600;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ep{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:0.78125rem;word-break:break-all}.m{font-size:0.6875rem;font-weight:700;color:var(--muted);white-space:nowrap}
.badge{font-size:0.71875rem;padding:2px 7px;border-radius:6px;white-space:nowrap}.b-bad{background:var(--bad-s);color:var(--bad)}.b-warn{background:var(--warn-s);color:var(--warn)}.b-gray{background:var(--gray-s);color:var(--muted)}
.empty{padding:14px 13px;color:var(--muted)}.small{font-size:0.75rem;color:var(--muted)}footer{color:var(--faint);font-size:0.75rem;margin-top:20px}svg{display:block}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}.lnk{border:0;background:none;padding:0;font:inherit;font-size:0.75rem;color:var(--acc);cursor:pointer;text-align:left;text-decoration:underline}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (forced-colors:active){.seg button.on,.tabs button.on{outline:2px solid CanvasText;outline-offset:-2px}.badge,.cnt{border:1px solid}
.seg button:focus-visible,.tabs button:focus-visible,:focus-visible{outline:3px solid Highlight;outline-offset:2px}svg rect{fill:CanvasText;opacity:1}svg rect.out{fill:GrayText;stroke:GrayText}}</style>
</head>
