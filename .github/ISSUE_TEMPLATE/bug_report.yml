name: Bug report
description: Something is wrong — a crash, wrong numbers, a source that does not parse
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! **Do not paste raw logs, tokens, IPs, hostnames or customer data** — issues are public. Synthetic or redacted examples are perfect.
        Security problem? Report it privately instead: https://github.com/talikbaku/api-dead-ends/security/advisories/new
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you ran
      description: Optional if the problem is in the docs or in an existing report.
      render: shell
  - type: textarea
    id: output
    attributes:
      label: Output or error (redacted)
      render: text
  - type: input
    id: version
    attributes:
      label: "api-dead-ends version (`api-dead-ends --version`)"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Node.js version and OS
      placeholder: "Node 22.12, macOS 15"
  - type: input
    id: source
    attributes:
      label: Data source, if relevant
      placeholder: "Kibana / Elasticsearch, VictoriaLogs, Datadog, Prometheus, access logs, CSV…"
